<!doctype html>
<html><body style="margin:0;padding:24px;background:#fff8ee;font-family:Arial,Helvetica,sans-serif;color:#2b2b2b">
<div style="max-width:480px;margin:0 auto;background:#ffffff;border-radius:16px;padding:24px">
  <p style="font-size:18px;margin:0 0 12px">Hello!</p>
  <p style="font-size:18px;margin:0 0 12px">Your next Japan activity is ready:<br><strong>{{ item.activity.title }}</strong></p>
  <p style="font-size:16px;margin:0 0 20px">It takes a few minutes. Do it together as a family.</p>
  <p style="margin:0 0 20px"><a href="{{ go }}" style="display:inline-block;background:#d7263d;color:#ffffff;text-decoration:none;font-size:18px;font-weight:bold;padding:14px 24px;border-radius:999px">Let's go!</a></p>
  <p style="font-size:14px;margin:0 0 20px">{{ left }} activit{{ left|pluralize:"y,ies" }} wait{{ left|pluralize:"s," }} before your trip.</p>
  <p style="font-size:12px;color:#777;margin:0">We send this note every two days at most.
  <a href="{{ stop }}" style="color:#777">Stop these emails</a>.</p>
</div>
</body></html>
