{% extends "base.html" %}
{% block title %}Our course{% endblock %}
{% block content %}
<section class="panel">
  <h1>Your course for Japan</h1>
  <p class="lead">We picked these for your family ({{ trip.ages|join:", " }}). Switch any of them on or off.</p>
  <form method="post">
    {% csrf_token %}
    <div class="cards modules">
      {% for row in modules %}
      <label class="card module {% if row.suggested %}suggested{% endif %}">
        <input type="checkbox" name="modules" value="{{ row.module.id }}" {% if row.on %}checked{% endif %}>
        <span class="card-emoji" aria-hidden="true">{{ row.module.emoji }}</span>
        <h3>{{ row.module.title }}</h3>
        <p>{{ row.module.summary }}</p>
        <span class="tags">
          {% if row.module.audience == "child" %}<span class="badge">For kids</span>{% elif row.module.audience == "adult" %}<span class="badge">For grown-ups</span>{% endif %}
          {% if not row.suggested %}<span class="badge muted">Not picked for you</span>{% endif %}
          {% if not row.module.ready %}<span class="badge muted">More coming soon</span>{% endif %}
        </span>
        <span class="switch" aria-hidden="true"></span>
      </label>
      {% endfor %}
    </div>
    <button class="btn big" type="submit">{% if course %}Rebuild our course{% else %}Build our course!{% endif %}</button>
  </form>
</section>
{% endblock %}
