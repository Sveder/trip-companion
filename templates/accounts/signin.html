{% extends "base.html" %}
{% block title %}Sign in{% endblock %}
{% block content %}
<section class="panel narrow">
  <h1>Sign in</h1>
  <p>Type your email. We send you a short code. No password needed.</p>
  <form method="post" class="form">
    {% csrf_token %}
    {{ form.as_p }}
    <button class="btn big" type="submit">Send me a code</button>
  </form>
</section>
{% endblock %}
