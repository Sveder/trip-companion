{% extends "base.html" %}
{% load i18n %}
{% block title %}{% translate "Sign in" %}{% endblock %}
{% block content %}
<section class="panel narrow">
  <h1>{% translate "Sign in" %}</h1>
  <p>{% translate "Type your email. We send you a 6-digit code. No password needed." %}</p>
  <form method="post" class="form">
    {% csrf_token %}
    {{ form.as_p }}
    <button class="btn big" type="submit">{% translate "Send me a code" %}</button>
  </form>
</section>
{% endblock %}
