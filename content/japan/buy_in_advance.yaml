                text: "Two flat pins (type A). Buy one for each charger you use at night."
                text_he: "שני פינים שטוחים (סוג A). קונים אחד לכל מטען שמשתמשים בו בלילה."
              - emoji: "🥢"
                title: "Kids' chopsticks"
                title_he: "צ'ופסטיקס לילדים"
                text: "Practise at home for a few weeks. The link is on the 'Buy before you go' cards."
                text_he: "מתאמנים בבית כמה שבועות. הקישור נמצא בכרטיסים של 'לקנות לפני הנסיעה'."
              - emoji: "📶"
