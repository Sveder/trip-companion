        label: "Umbrella"
        label_he: "מטרייה"
      - id: "snacks"
        img: "lesson/pack/snacks.svg"
        label: "Rice ball"
        label_he: "כדור אורז"
      - id: "cash"
        img: "lesson/pack/cash.svg"
        label: "Cash"
        label_he: "מזומן"
      - id: "seven"
        img: "lesson/pack/seven.svg"
        label: "ATM at 7-Eleven"
        label_he: "כספומט בסבן-אילבן"
      - id: "postatm"
        img: "lesson/pack/postatm.svg"
        label: "Post office ATM"
        label_he: "כספומט בדואר"
