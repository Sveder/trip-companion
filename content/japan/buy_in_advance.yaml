        label_he: "נעלי שחלה"
      - id: "snackbox"
        img: "lesson/pack/snackbox.svg"
        label: "Snack box"
        label_he: "קופסת חטיפים"
      - id: "esim"
        img: "lesson/pack/esim.svg"
        label: "eSIM"
        label_he: "eSIM"
      - id: "vjw"
