id: chopsticks
title: Eat with chopsticks
title_he: אוכלים עם צ'ופסטיקס
summary: Learn to hold chopsticks, then show everyone.
summary_he: לומדים להחזיק צ'ופסטיקס, ואז מראים לכולם.
emoji: "🥢"
audience: all
order: 70
ready: true
activities:
  - id: chopsticks-lesson
    title: Chopstick master
    title_he: אלופי הצ'ופסטיקס
    type: lesson
    intro: Swipe through the pages. Tap the pictures, play the games, and practise with real chopsticks!
    intro_he: עוברים דף אחרי דף. געו בתמונות, שחקו במשחקים, ותתאמנו עם צ'ופסטיקס אמיתיים!
