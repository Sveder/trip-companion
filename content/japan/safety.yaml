id: safety
title: Staying safe
title_he: שומרים על עצמנו
summary: Who to call if you need help.
summary_he: למי מתקשרים כשצריך עזרה.
emoji: "🚑"
audience: all
order: 40
ready: true
activities:
  - id: safety-lesson
    title: Safe like a kid in Japan
    title_he: בטוחים כמו ילדים ביפן
    type: lesson
    intro: Swipe through the pages. Tap the pictures, play the games, and practise each thing at home!
    intro_he: עוברים דף אחרי דף. געו בתמונות, שחקו במשחקים, ותתאמנו על כל דבר בבית!
    pictures:
      - id: "police"
