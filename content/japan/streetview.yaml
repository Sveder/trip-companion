id: streetview
title: Street View hunt
title_he: ציד ברחוב
summary: Look around a real place in Japan and find hidden things.
summary_he: מסתכלים מסביב במקום אמיתי ביפן ומוצאים דברים מוסתרים.
emoji: "🔎"
audience: child
order: 60
ready: true
# Each place is a 360° photo on Google Maps. lat/lng are exact to 7 digits: the embed opens the photo
# nearest to that point, so these numbers pick the photo. The "spot" lists were checked against the photos
# on 2026-10-07 and again on 2026-10-08 (trip-companion-tools/sv_probe.cjs).
# Each spot has a proper name (name), a short line a 4-year-old can follow (text), and why it matters (about).
# Spots are Japanese things only (buildings, statues, objects, customs), never people or cars that happened to be there.
# heading = where the view looks first (0 = north).
activities:
  - id: streetview-lesson
    title: What is that? Things on a Japanese street
    title_he: מה זה? דברים ברחוב ביפן
    type: lesson
    intro: Swipe through the pages. Tap the pictures, play the games, and get ready for the three hunts!
    intro_he: עוברים דף אחרי דף. געו בתמונות, שחקו במשחקים, ותתכוננו לשלושת הצידים!
    pictures:
      - id: "torii"
        img: "photo/street/st-torii.jpg"
        label: "A torii gate"
        label_he: "שער טוריאי"
      - id: "sanmon"
        img: "photo/street/st-sanmon.jpg"
        label: "A temple gate"
        label_he: "שער של מקדש בודהיסטי"
      - id: "komainu"
        img: "photo/street/st-komainu.jpg"
        label: "A lion-dog statue"
        label_he: "פסל של כלב-אריה"
      - id: "incense"
        img: "photo/street/st-incense.jpg"
        label: "An incense pot"
        label_he: "סיר קטורת"
      - id: "jizo"
        img: "photo/street/st-jizo.jpg"
        label: "A Jizo statue"
        label_he: "פסל ג'יזו"
      - id: "neko"
        img: "photo/street/st-neko.jpg"
        label: "A lucky cat"
        label_he: "חתול מזל"
      - id: "vending"
        img: "photo/street/st-vending.jpg"
        label: "A vending machine"
        label_he: "מכונת משקאות"
      - id: "manhole"
        img: "photo/street/st-manhole.jpg"
        label: "A painted manhole cover"
        label_he: "מכסה ביוב מצויר"
      - id: "postbox"
        img: "photo/street/st-postbox.jpg"
        label: "A red post box"
        label_he: "תיבת דואר אדומה"
      - id: "bike"
        img: "photo/street/st-bike.jpg"
        label: "A bicycle"
        label_he: "אופניים"
      - id: "hot"
        img: "photo/street/st-hot.jpg"
        label: "A hot drink"
        label_he: "שתייה חמה"
      - id: "cold"
        img: "photo/street/st-cold.jpg"
        label: "A cold drink"
        label_he: "שתייה קרה"
      - id: "balloon"
        img: "photo/street/st-balloon.jpg"
        label: "A balloon"
        label_he: "בלון"
      - id: "icecream"
        img: "photo/street/st-icecream.jpg"
        label: "Ice cream"
        label_he: "גלידה"
    pages:
      - kind: text
        title: Let's go hunting!
        title_he: יוצאים לצוד!
        img: photo/street/st-torii-wide.jpg
        photo_credit: st-torii-wide
        japanese: 見つけた
        reading: mitsuketa
        reading_hebrew: "מיצוקטה"
        text: A street in Japan has many things we do not have at home. This lesson shows you what to look for. Then you play the three hunts and find them in real places!
        text_he: ברחוב ביפן יש הרבה דברים שאין לנו בבית. השיעור הזה מראה לכם מה לחפש. אחר כך משחקים בשלושת הצידים ומוצאים אותם במקומות אמיתיים!
        tips:
          - When you find a thing, shout "mitsuketa!". It means "I found it!".
          - Look up, look down, and look all around.
          - A shrine and a temple are two different places. You learn the difference here.
        tips_he:
          - כשמוצאים משהו, צועקים "מיצוקטה!". זה אומר "מצאתי!".
          - מסתכלים למעלה, מסתכלים למטה, ומסתכלים מסביב.
          - מקדש שינטו ומקדש בודהיסטי הם שני מקומות שונים. כאן לומדים מה ההבדל.
      - kind: spots
        title: A street to explore
        title_he: רחוב לגלות
        img: photo/street/st-street.jpg
        photo_credit: st-street
        text: This is a real corner in Tokyo. Tap each number to see what it is.
        text_he: זו פינה אמיתית בטוקיו. געו בכל מספר כדי לראות מה זה.
        spots:
          - x: 73
            y: 61
            label: "The red post box"
            label_he: "תיבת הדואר האדומה"
            japanese: "ポスト"
            reading: "posuto"
            reading_hebrew: "פוסטו"
            text: "Post boxes in Japan are red. Look for the mark that looks like a T with a bar on top. It means \"post\". Can you see it on this box?"
            text_he: "תיבות הדואר ביפן אדומות. מחפשים את הסימן שנראה כמו T עם קו מעליו. הוא אומר \"דואר\". רואים אותו על התיבה הזאת?"
          - x: 35
            y: 12
            label: "The shop sign"
            label_he: "השלט של החנות"
            text: "This small shop sells okonomiyaki: a big flat pancake with cabbage, cooked on a hot plate. The sign says the taste comes from Osaka."
            text_he: "החנות הקטנה הזאת מוכרת אוקונומיאקי: פנקייק גדול ושטוח עם כרוב, שמבשלים על פלטה חמה. השלט אומר שהטעם בא מאוסקה."
          - x: 85
            y: 41
            label: "The tall sign on the pole"
            label_he: "השלט הגבוה על העמוד"
            text: "Japanese can be written from top to bottom. Read this sign down! At the bottom a hand points and says \"koko\": \"here!\"."
            text_he: "אפשר לכתוב יפנית מלמעלה למטה. קוראים את השלט הזה כלפי מטה! למטה יש יד שמצביעה ואומרת \"קוקו\": \"כאן!\"."
          - x: 24
            y: 54
            label: "The green address sign"
            label_he: "שלט הכתובת הירוק"
            text: "Most small streets in Japan have no name. A sign like this gives the area and the block number instead. Here: Setagaya, part 4, block 5."
            text_he: "לרוב הרחובות הקטנים ביפן אין שם. שלט כזה נותן במקום זה את השכונה ואת מספר הגוש. כאן: סטגאיה, חלק 4, גוש 5."
          - x: 41
            y: 62
            label: "The sliding door"
            label_he: "הדלת הנגררת"
            text: "Many old shops and homes in Japan have sliding doors. You do not push them. You slide them to the side."
            text_he: "להרבה חנויות ובתים ישנים ביפן יש דלתות נגררות. לא דוחפים אותן. מזיזים אותן הצידה."
          - x: 9
            y: 22
            label: "The power pole"
            label_he: "עמוד החשמל"
            text: "Look up! Many streets in Japan have tall poles with lots of wires over the street."
            text_he: "מסתכלים למעלה! בהרבה רחובות ביפן יש עמודים גבוהים עם המון חוטים מעל הרחוב."
      - kind: flip
        title: Shrine or temple?
        title_he: מקדש שינטו או מקדש בודהיסטי?
        text: Japan has two kinds of holy places. Tap a card to turn it.
        text_he: ביפן יש שני סוגים של מקומות קדושים. געו בכרטיס כדי להפוך אותו.
        cards:
          - img: "photo/street/st-torii.jpg"
            label: "Shrine: the torii gate"
            label_he: "מקדש שינטו: שער טוריאי"
            japanese: "じんじゃ"
            reading: "jinja"
            reading_hebrew: "ג'ינג'ה"
            meaning: "Shinto shrine"
            meaning_he: "מקדש שינטו"
            text: "A torii gate shows you a shrine, a jinja: a Shinto place for the kami, the spirits of nature."
            text_he: "שער טוריאי מראה שזה מקדש שינטו, ג'ינג'ה: מקום של הקאמי, הרוחות של הטבע."
          - img: "photo/street/st-sanmon.jpg"
            label: "Temple: the big wooden gate"
            label_he: "מקדש בודהיסטי: שער עץ גדול"
            japanese: "おてら"
            reading: "otera"
            reading_hebrew: "אוטרה"
            meaning: "Buddhist temple"
            meaning_he: "מקדש בודהיסטי"
            text: "A big wooden gate with a roof shows a Buddhist temple, an otera. Two strong guardians often stand in it."
            text_he: "שער עץ גדול עם גג מראה שזה מקדש בודהיסטי, אוטרה. לפעמים עומדים בשער שני שומרים חזקים."
          - img: "photo/street/st-komainu.jpg"
            label: "The guardian animals"
            label_he: "חיות השמירה"
            japanese: "こまいぬ"
            reading: "komainu"
            reading_hebrew: "קומאינו"
            text: "Two lion-dogs, komainu, guard the way into many shrines. At a fox shrine, two foxes guard it."
            text_he: "שני כלבים-אריות, קומאינו, שומרים על הכניסה להרבה מקדשי שינטו. במקדש של שועלים, שני שועלים שומרים."
          - img: "photo/street/st-incense.jpg"
            label: "The incense pot"
            label_he: "סיר הקטורת"
            japanese: "じょうこうろ"
            reading: "joukouro"
            reading_hebrew: "ג'וקורו"
            text: "Many temples have a big pot of incense. People wave the smoke over their body, for good health."
            text_he: "בהרבה מקדשים בודהיסטיים יש סיר גדול של קטורת. מנפנפים את העשן על הגוף, לבריאות טובה."
          - img: "photo/street/st-jizo.jpg"
            label: "The little stone statue"
            label_he: "פסל האבן הקטן"
            japanese: "おじぞうさん"
            reading: "ojizousan"
            reading_hebrew: "אוג'יזוסאן"
            text: "This is Jizo. People say Jizo looks after children and travellers, so people dress him in a red bib."
            text_he: "זה ג'יזו. אומרים שג'יזו שומר על ילדים ועל מטיילים, ולכן מלבישים אותו בסינר אדום."
      - kind: pick
        title: Shrine or temple game
        title_he: משחק מקדשים
        text: Tap the right picture.
        text_he: געו בתמונה הנכונה.
        rounds:
          - ask: "Which gate shows you a shrine?"
            ask_he: "איזה שער מראה שזה מקדש שינטו?"
            answer: "torii"
            choices: [sanmon, torii, postbox, vending]
          - ask: "Which one do you find at a temple?"
            ask_he: "מה מוצאים במקדש בודהיסטי?"
            answer: "incense"
            choices: [komainu, manhole, incense, torii]
          - ask: "Which animal guards a shrine?"
            ask_he: "איזו חיה שומרת על מקדש שינטו?"
            answer: "komainu"
            choices: [neko, bike, jizo, komainu]
      - kind: spots
        title: A temple yard
        title_he: החצר של מקדש בודהיסטי
        img: photo/street/st-temple.jpg
        photo_credit: st-temple
        text: This is Senso-ji, the oldest temple in Tokyo, in the evening. Tap each number to see what is there.
        text_he: זה סנסו-ג'י, המקדש הכי עתיק בטוקיו, בערב. געו בכל מספר כדי לראות מה יש שם.
        spots:
          - x: 50
            y: 33
            label: "The main hall"
            label_he: "האולם הראשי"
            text: "The main hall keeps a holy statue. People walk up the steps, put a coin in the big box, put their hands together and make a quiet wish. At a temple you do not clap."
            text_he: "באולם הראשי שומרים פסל קדוש. עולים במדרגות, שמים מטבע בתיבה הגדולה, מצמידים ידיים ומבקשים משאלה בשקט. במקדש בודהיסטי לא מוחאים כפיים."
          - x: 16
            y: 40
            label: "The big roof"
            label_he: "הגג הגדול"
            text: "Look at the roof. Its ends curve up at the corners, like the roofs of many temples in Japan."
            text_he: "מסתכלים על הגג. הקצוות שלו מתעקלים למעלה בפינות, כמו הגגות של הרבה מקדשים ביפן."
          - x: 50
            y: 61
            label: "The big red lantern"
            label_he: "הפנס האדום הגדול"
            text: "A huge paper lantern hangs at the door of the hall. It is taller than a grown-up!"
            text_he: "פנס נייר ענק תלוי בדלת של האולם. הוא גבוה יותר ממבוגר!"
          - x: 62
            y: 89
            label: "The incense pot"
            label_he: "סיר הקטורת"
            text: "People light sticks of incense and put them in the pot. Then they wave the smoke over their head and body, for good health."
            text_he: "אנשים מדליקים מקלות קטורת ושמים אותם בסיר. אחר כך הם מנפנפים את העשן על הראש ועל הגוף, לבריאות טובה."
          - x: 5
            y: 68
            label: "The lucky charm stall"
            label_he: "הדוכן של קמעות המזל"
            text: "Here you can buy an omamori: a small lucky charm in a cloth bag. People hang it on a school bag or keep it in a wallet."
            text_he: "כאן אפשר לקנות אומאמורי: קמע מזל קטן בשקית בד. תולים אותו על תיק בית הספר או שומרים אותו בארנק."
      - kind: text
        title: The lucky cat
        title_he: חתול המזל
        img: photo/street/st-cats.jpg
        photo_credit: st-cats
        japanese: 招き猫
        reading: maneki neko
        reading_hebrew: "מאנקי נקו"
        text: The lucky cat, maneki-neko, holds one paw up. In Japan this wave means "come here!". Shops put a lucky cat by the door to call good luck and people in.
        text_he: חתול המזל, מנקי-נקו, מרים כף יד אחת. ביפן התנועה הזאת אומרת "בוא הנה!". חנויות שמות חתול מזל ליד הדלת כדי לקרוא למזל ולאנשים להיכנס.
        tips:
          - The temple Gotoku-ji in Tokyo has thousands of white lucky cats. You visit it in the first hunt!
          - Count the lucky cats you see in shop windows. Who finds the most?
          - Back home, look in a Japanese or Chinese shop. A lucky cat often waits by the till.
        tips_he:
          - במקדש גוטוקו-ג'י בטוקיו יש אלפי חתולי מזל לבנים. מבקרים בו בציד הראשון!
          - סופרים את חתולי המזל שרואים בחלונות של חנויות. מי מוצא הכי הרבה?
          - בבית, מסתכלים בחנות יפנית או סינית. הרבה פעמים חתול מזל מחכה ליד הקופה.
      - kind: video
        title: Watch and look
        title_he: צופים ומחפשים
        text: Watch, then play the window game below with your family.
        text_he: צופים, ואז משחקים במשחק החלון עם המשפחה.
        # Only Michael approves a video. Candidates: QEC3MrWgnMU ("Japan for Kids - A kids guide to Japan.",
        # Professor Propeller's Planet), S603E1utiwE ("Japan for kids - an amazing and quick guide to Japan", Learning Tail).
        # A search found no kids' video that walks a Japanese street.
        youtube: QEC3MrWgnMU
        approved: false
        fallback_title: The five-thing walk
        fallback_title_he: ההליכה של חמשת הדברים
        fallback_text: "Go on a five-thing walk with your family."
        fallback_text_he: "יוצאים עם המשפחה להליכה של חמשת הדברים."
        fallback_img: photo/street/st-street.jpg
        fallback:
          - "Before the trip: walk around your street with your family. Find five things: a post box, a drinks machine, a manhole cover, a shop door and a bicycle."
          - "Say what is different in Japan: the post box is red, the drinks machine has hot drinks, the manhole cover has a picture."
          - "In Japan: do the same walk from the hotel on the first day. Shout \"mitsuketa!\" for each thing you find."
          - "Take a photo of the best manhole cover you find."
        fallback_he:
          - "לפני הטיול: מסתובבים ברחוב שלכם עם המשפחה. מוצאים חמישה דברים: תיבת דואר, מכונת משקאות, מכסה ביוב, דלת של חנות ואופניים."
          - "אומרים מה שונה ביפן: תיבת הדואר אדומה, במכונת המשקאות יש שתייה חמה, ועל מכסה הביוב יש תמונה."
          - "ביפן: עושים את אותה הליכה מהמלון ביום הראשון. צועקים \"מיצוקטה!\" על כל דבר שמוצאים."
          - "מצלמים את מכסה הביוב הכי יפה שמוצאים."
      - kind: flip
        title: Signs to know
        title_he: שלטים שכדאי להכיר
        text: Japanese has its own letters. Learn five signs by their shape. Tap a card to turn it.
        text_he: ליפנית יש אותיות משלה. לומדים חמישה שלטים לפי הצורה. געו בכרטיס כדי להפוך אותו.
        cards:
          - img: "lesson/street/sign-exit.svg"
            label: "Deguchi"
            label_he: "דגוצ'י"
            japanese: "でぐち"
            reading: "deguchi"
            reading_hebrew: "דגוצ'י"
            meaning: "exit"
            meaning_he: "יציאה"
            text: "出口 means \"exit\", the way out. In many stations the exit signs are yellow."
            text_he: "出口 אומר \"יציאה\", הדרך החוצה. בהרבה תחנות שלטי היציאה צהובים."
          - img: "lesson/street/sign-in.svg"
            label: "Iriguchi"
            label_he: "איריגוצ'י"
            japanese: "いりぐち"
            reading: "iriguchi"
            reading_hebrew: "איריגוצ'י"
            meaning: "entrance"
            meaning_he: "כניסה"
            text: "入口 means \"entrance\", the way in. The first letter looks like a person walking in."
            text_he: "入口 אומר \"כניסה\", הדרך פנימה. האות הראשונה נראית כמו אדם שנכנס."
          - img: "lesson/street/sign-eki.svg"
            label: "Eki"
            label_he: "אקי"
            japanese: "えき"
            reading: "eki"
            reading_hebrew: "אקי"
            meaning: "station"
            meaning_he: "תחנה"
            text: "駅 means \"station\". Look for it when you need a train."
            text_he: "駅 אומר \"תחנה\". מחפשים אותו כשצריכים רכבת."
          - img: "lesson/street/sign-post.svg"
            label: "The post mark"
            label_he: "סימן הדואר"
            text: "〒 is the post mark. You see it on post boxes and on post offices."
            text_he: "〒 הוא סימן הדואר. רואים אותו על תיבות דואר ועל סניפי דואר."
          - img: "lesson/street/sign-toilet.svg"
            label: "Toire"
            label_he: "טוירה"
            japanese: "トイレ"
            reading: "toire"
            reading_hebrew: "טוירה"
            meaning: "toilet"
            meaning_he: "שירותים"
            text: "トイレ says \"toire\". It means \"toilet\". Good to know!"
            text_he: "トイレ אומר \"טוירה\". זה אומר \"שירותים\". טוב לדעת!"
      - kind: spots
        title: A vending machine
        title_he: מכונת משקאות
        img: photo/street/st-vending-big.jpg
        photo_credit: st-vending-big
        text: Let's buy a drink! Tap each dot to see how the machine works.
        text_he: בואו נקנה משהו לשתות! געו בכל נקודה כדי לראות איך המכונה עובדת.
        spots:
          - x: 50
            y: 12
            label: "The vending machine"
            label_he: "מכונת המשקאות"
            japanese: "じどうはんばいき"
            reading: "jidouhanbaiki"
            reading_hebrew: "ג'ידוהנבאיקי"
            text: "Japan has drinks machines on almost every street, even far from the city. You find a cold drink or a hot drink, all day and all night."
            text_he: "ביפן יש מכונות משקאות כמעט בכל רחוב, אפילו רחוק מהעיר. מוצאים בהן שתייה קרה או שתייה חמה, כל היום וכל הלילה."
