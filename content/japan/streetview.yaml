            text: "For grown-ups. Touch a card or a phone on this pad instead of coins. Many machines take a train card, like Suica or PASMO."
            text_he: "למבוגרים. נוגעים כאן עם כרטיס או עם טלפון במקום מטבעות. הרבה מכונות מקבלות כרטיס רכבת, כמו סואיקה או פסמו."
          - x: 69
            y: 53
            label: "The return lever"
