<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" role="img" aria-label="A big name card: a name, a photo box, a phone number, a hotel name, and the Japanese words maigo desu and tasukete"><title>My name card</title><rect width="400" height="260" fill="#ffeef2"/><rect x="30" y="20" width="340" height="220" rx="16" fill="#fff" stroke="#bc002d" stroke-width="5"/><rect x="306" y="38" width="48" height="56" rx="6" fill="#f4f4f4" stroke="#999" stroke-width="2" stroke-dasharray="5 4"/><circle cx="330" cy="58" r="7" fill="none" stroke="#999" stroke-width="2"/><path d="M314 86 L326 72 L334 80 L340 74 L346 86Z" fill="#bbb"/><text x="60" y="66" font-size="22" font-family="sans-serif" font-weight="bold" fill="#3b2a20" text-anchor="start">Name: Maya</text><text x="60" y="108" font-size="20" font-family="sans-serif" font-weight="bold" fill="#1d3c5c" text-anchor="start">Phone: +972 ...</text><text x="60" y="148" font-size="20" font-family="sans-serif" font-weight="bold" fill="#2e9e5b" text-anchor="start">Hotel: Sakura Hotel</text><text x="60" y="190" font-size="20" font-family="sans-serif" font-weight="bold" fill="#bc002d" text-anchor="start">迷子です maigo desu</text><text x="60" y="226" font-size="20" font-family="sans-serif" font-weight="bold" fill="#bc002d" text-anchor="start">助けて tasukete</text></svg>