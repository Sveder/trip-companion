<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" role="img" aria-label="A big name card: a child's name, a phone number, a hotel name, and the Japanese words maigo desu and tasukete"><title>My name card</title><rect width="400" height="260" fill="#ffeef2"/><rect x="30" y="20" width="340" height="220" rx="16" fill="#fff" stroke="#bc002d" stroke-width="5"/><circle cx="330" cy="64" r="18" fill="#ffd9b8" stroke="#c99a76" stroke-width="2"/><circle cx="323.7" cy="64" r="2.7" fill="#3b2a20"/><circle cx="336.3" cy="64" r="2.7" fill="#3b2a20"/><path d="M324.6 71.2 Q330 77.5 335.4 71.2" fill="none" stroke="#3b2a20" stroke-width="2.5" stroke-linecap="round"/><path d="M312 60.4 Q330 33.4 348 60.4 Q330 47.8 312 60.4Z" fill="#3b2a20"/><text x="60" y="66" font-size="22" font-family="sans-serif" font-weight="bold" fill="#3b2a20" text-anchor="start">Name: Maya</text><text x="60" y="108" font-size="20" font-family="sans-serif" font-weight="bold" fill="#1d3c5c" text-anchor="start">Phone: +972 ...</text><text x="60" y="148" font-size="20" font-family="sans-serif" font-weight="bold" fill="#2e9e5b" text-anchor="start">Hotel: Sakura Hotel</text><text x="60" y="190" font-size="20" font-family="sans-serif" font-weight="bold" fill="#bc002d" text-anchor="start">迷子です maigo desu</text><text x="60" y="226" font-size="20" font-family="sans-serif" font-weight="bold" fill="#bc002d" text-anchor="start">助けて tasukete</text></svg>