server {
    listen 80;
    server_name trip.sveder.com;

    client_max_body_size 50M;

    location = /sveder-badge.js { alias /srv/www/_shared/sveder-badge.js; }
    location /static/ { alias /srv/www/trip-companion/staticfiles/; expires 1h; }
    location /media/ { alias /srv/www/trip-companion/media/; }

    location / {
        proxy_pass http://127.0.0.1:8031;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
