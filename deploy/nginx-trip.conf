server {
    listen 80;
    server_name trip.sveder.com;

    client_max_body_size 50M;

    location = /sveder-badge.js { alias /srv/www/_shared/sveder-badge.js; }
    # T229: a file name with a content hash (app.3f2a91c0b1d4.css) never changes, so the browser keeps it a year.
    # A plain name (the 500 page fallback, a missing manifest entry) keeps the short cache.
    location /static/ {
        alias /srv/www/trip-companion/staticfiles/;
        expires 1h;
        location ~ "\.[0-9a-f]{12}\.[A-Za-z0-9]+$" {
            expires off;
            add_header Cache-Control "public, max-age=31536000, immutable";
            add_header X-Content-Type-Options nosniff;
        }
    }
    location /media/ { alias /srv/www/trip-companion/media/; }

    location / {
        proxy_pass http://127.0.0.1:8031;
        proxy_set_header Host $host;
        # T191: the app rate-limits by X-Real-IP. Set it here, so a browser cannot send its own value.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # T191: a family link token is in these paths. Do not write them to the access log.
    location ~ ^/(continue|reminders/stop)/[^/]+/ {
        access_log off;
        proxy_pass http://127.0.0.1:8031;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
