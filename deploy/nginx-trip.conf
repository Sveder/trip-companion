server {
    listen 80;
    server_name trip.sveder.com;

    client_max_body_size 50M;

    location = /sveder-badge.js { alias /srv/www/_shared/sveder-badge.js; }
    location /static/ { alias /srv/www/trip-companion/staticfiles/; expires 1h; }
    location /media/ { alias /srv/www/trip-companion/media/; }

    location / {
        proxy_pass http://127.0.0.1:8031;
        proxy_set_header Host $host;
        # T191: the app rate-limits by X-Real-IP. Set it here, so a browser cannot send its own value.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # T191: a family link token is in these paths. Do not write them to the access log.
    location ~ ^/(continue|reminders/stop)/[^/]+/ {
        access_log off;
        proxy_pass http://127.0.0.1:8031;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
